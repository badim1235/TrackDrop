name: Render Health Probe

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: render-health-probe
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check Render health endpoint
        env:
          HEALTH_URL: ${{ vars.RENDER_HEALTH_URL }}
        run: |
          if [ -z "$HEALTH_URL" ]; then
            echo "RENDER_HEALTH_URL repository variable is not configured."
            exit 1
          fi

          curl \
            --fail \
            --silent \
            --show-error \
            --location \
            --header "User-Agent: TrackPick-Render-Keep-Alive/1.0" \
            --connect-timeout 10 \
            --max-time 120 \
            --retry 2 \
            --retry-delay 5 \
            --retry-all-errors \
            "$HEALTH_URL"
