<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <style>
      @font-face {
        font-family: "Wanted Sans";
        src: url("../public/fonts/WantedSansVariable.woff2") format("woff2-variations");
        font-style: normal;
        font-weight: 400 1000;
      }

      * { box-sizing: border-box; }

      html,
      body {
        width: 1200px;
        height: 630px;
        margin: 0;
      }

      body {
        display: grid;
        place-items: center;
        color: #1c1c1c;
        background: #f7f4ed;
        font-family: "Wanted Sans", sans-serif;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 38px;
      }

      .mark {
        width: 150px;
        height: 150px;
        display: grid;
        place-items: center;
        color: #fcfbf8;
        background: #1c1c1c;
        border-radius: 26px;
      }

      .mark svg {
        width: 88px;
        height: 88px;
        fill: none;
        stroke: currentColor;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-width: 2;
      }

      .name {
        font-size: 104px;
        font-weight: 900;
        letter-spacing: 0;
        line-height: 1;
      }
    </style>
  </head>
  <body>
    <div class="brand">
      <div class="mark">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="8" cy="18" r="3" />
          <circle cx="18" cy="16" r="3" />
          <path d="M11 18V5l10-2v13" />
        </svg>
      </div>
      <div class="name">TrackPick</div>
    </div>
  </body>
</html>
