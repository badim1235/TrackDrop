name: trackdrop

services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_DB: trackdrop
      POSTGRES_USER: trackdrop
      POSTGRES_PASSWORD: trackdrop
    ports:
      - "5432:5432"
    volumes:
      - trackdrop-postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trackdrop -d trackdrop"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  trackdrop-postgres:
